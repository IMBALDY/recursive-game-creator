<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-drf2xzWkzOHjIuftNM7eK+eDv+RpBjYGkVclnA1fiUI='; style-src 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' data: file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1928" />
    <title>明天见 · 离线完整版</title>
    <style>:root {
  color-scheme: dark;
  --ink: #e4e7df;
  --muted: #acbdc3;
  --gold: #cbb889;
  --line: #82999945;
  --panel: #0d202deb;
  --serif: "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  --sans: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #060e18;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
}
button,
input,
textarea,
select {
  font: inherit;
}
button,
a,
summary {
  touch-action: manipulation;
}
button {
  color: inherit;
  background: #142a38;
  border: 1px solid var(--line);
  padding: 10px 17px;
  cursor: pointer;
  transition:
    background 0.2s,
    border-color 0.2s;
}
button:hover {
  background: #284653;
  border-color: var(--gold);
}
button:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 2px solid #e0c795;
  outline-offset: 4px;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
a {
  color: inherit;
}
input,
textarea,
select {
  color: var(--ink);
  background: #071724;
  border: 1px solid #82999966;
  padding: 10px;
  border-radius: 2px;
  width: 100%;
}
textarea {
  resize: vertical;
  min-height: 72px;
  line-height: 1.6;
}
label {
  display: block;
  color: var(--muted);
  margin: 16px 0 8px;
}
p {
  line-height: 1.75;
}
h1,
h2,
p,
figure {
  margin: 0;
}
[hidden] {
  display: none !important;
}
#stage {
  position: relative;
  max-width: 1800px;
  width: 100%;
  height: 100dvh;
  min-height: 540px;
  max-height: 1100px;
  margin: auto;
  overflow: hidden;
  background: #101f2d;
}
.background,
.veil,
.mist {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.background {
  width: 100%;
  height: 100%;
  overflow: hidden;
}
.veil {
  background:
    linear-gradient(90deg, #03101dcf 0%, #07162935 63%, #07162966),
    linear-gradient(0deg, #06121ded, transparent 70%);
}
.mist {
  background: radial-gradient(ellipse at 65% 55%, #b7d5d318, transparent 60%);
  animation: drift 14s ease-in-out infinite alternate;
}
.topbar {
  position: relative;
  z-index: 4;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 66px;
  padding: 0 4%;
  border-bottom: 1px solid #b1b4a322;
}
.topbar a {
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--gold);
}
#chapter {
  font-size: 12px;
  letter-spacing: 3px;
  color: #bdc9c9;
}
#menu-button {
  border: 0;
  background: transparent;
  font-size: 12px;
  letter-spacing: 2px;
}
#menu-button span {
  margin-left: 18px;
  color: var(--gold);
}
#title-screen {
  position: absolute;
  inset: 66px 0 0;
}
.title-copy {
  position: absolute;
  left: 10%;
  top: 9%;
  max-width: 550px;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 5px;
  color: var(--gold);
}
h1 {
  font-family: var(--serif);
  font-size: clamp(50px, 6.6vw, 100px);
  font-weight: 400;
  line-height: 1.18;
  letter-spacing: 10px;
  margin: 23px 0;
}
h1 span {
  letter-spacing: 20px;
}
.title-subtitle {
  font-family: var(--serif);
  font-size: 17px;
  letter-spacing: 3px;
  line-height: 1.9;
  color: #c0ced1;
}
.title-rule {
  width: 44px;
  height: 1px;
  background: var(--gold);
  margin: 22px 0;
}
.volume {
  font-size: 12px;
  letter-spacing: 2px;
}
.volume span {
  padding: 0 10px;
  color: var(--gold);
}
.title-actions {
  margin-top: 27px;
  display: flex;
  gap: 12px;
}
.primary {
  background: #c9b58a;
  color: #17232a;
  border-color: #c9b58a;
  min-width: 225px;
  text-align: left;
}
.primary:hover {
  background: #e5d4a9;
}
.primary span {
  float: right;
  margin-left: 35px;
}
.title-actions > button {
  padding: 15px 22px;
}
.profile-link {
  font-size: 12px;
  border: 0;
  background: transparent;
  padding-left: 0;
  color: #bdc9cb;
  margin-top: 16px;
}
.title-side {
  position: absolute;
  right: 8%;
  top: 16%;
  text-align: center;
  color: #c7d0cc;
}
.title-side > span {
  font-size: 10px;
  letter-spacing: 4px;
  writing-mode: vertical-rl;
  position: absolute;
  right: -24px;
  top: 0;
}
.clock-mark {
  width: 140px;
  height: 140px;
  display: grid;
  place-items: center;
  border: 1px solid #c7b68a66;
  border-radius: 50%;
  font: 48px Georgia;
  color: var(--gold);
  box-shadow: 0 0 0 12px #c7b68a0b;
}
.title-side p {
  font-family: var(--serif);
  font-size: 14px;
  line-height: 2.1;
  letter-spacing: 3px;
  margin-top: 70px;
}
.title-footer {
  position: absolute;
  bottom: 22px;
  left: 4%;
  right: 4%;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #adbdc0;
  letter-spacing: 2px;
}
#game-screen {
  position: absolute;
  inset: 66px 0 0;
}
.scene-caption {
  position: absolute;
  left: 5%;
  top: 30px;
  border-left: 2px solid var(--gold);
  padding: 4px 0 4px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-shadow: 0 2px 5px #000;
}
#scene-label {
  font: 22px var(--serif);
  letter-spacing: 4px;
}
#scene-sub {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
}
#portrait-card {
  position: absolute;
  right: 9%;
  top: 26px;
  height: calc(100% - 292px);
  max-height: 510px;
  aspect-ratio: 1;
  border: 1px solid #d4bc864d;
  box-shadow: 0 15px 60px #02091477;
  animation: arrive 0.5s ease-out;
  background: #152a38;
}
#portrait {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
}
#portrait-caption {
  position: absolute;
  bottom: -18px;
  right: 0;
  font-size: 9px;
  letter-spacing: 3px;
  color: #c7cbbc;
  background: #0a1c2bb0;
  padding: 2px 6px;
}
#prop {
  position: absolute;
  left: 7%;
  top: 125px;
  max-width: 240px;
  font: 18px var(--serif);
  line-height: 2;
  letter-spacing: 2px;
  color: #d4c39b;
  transform: rotate(-4deg);
  padding: 18px 23px;
  background: #162b36c9;
  border: 1px solid #ad9d6860;
  box-shadow: 0 12px 25px #0003;
}
.dialogue {
  position: absolute;
  bottom: 59px;
  left: 5%;
  right: 5%;
  background: linear-gradient(110deg, #0a1b2bee, #102b39e8);
  border: 1px solid #c9b58a66;
  border-top: 2px solid #b29e74;
  min-height: 185px;
  backdrop-filter: blur(12px);
  padding: 18px 28px 13px;
  box-shadow: 0 12px 35px #0005;
}
.name-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
#speaker {
  font-size: 16px;
  letter-spacing: 3px;
  color: var(--gold);
}
#node-counter {
  font-size: 10px;
  color: #809ba7;
  letter-spacing: 2px;
}
.text-continue {
  border: 0;
  background: transparent !important;
  padding: 0;
  text-align: left;
  width: 100%;
  cursor: pointer;
  min-height: 78px;
  display: block;
}
#story-text {
  font: 18px/1.9 var(--serif);
  letter-spacing: 1px;
}
.dialogue-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 29px;
  margin-top: 7px;
}
#continue-hint {
  font-size: 11px;
  color: #9eb4bb;
  margin-left: auto;
  letter-spacing: 1px;
}
#feedback-button {
  font-size: 11px;
  padding: 4px 0;
  background: transparent;
  border: 0;
  color: var(--gold);
}
#feedback-button span {
  color: #9aaeb5;
  padding-left: 10px;
}
.toolbar {
  position: absolute;
  bottom: 12px;
  left: 5%;
  right: 5%;
  display: flex;
  justify-content: flex-end;
  gap: 4px;
}
.toolbar button {
  background: transparent;
  border: 0;
  color: #b8c5c6;
  font-size: 12px;
  padding: 9px 14px;
}
.toolbar button:hover {
  color: var(--gold);
  background: #1d3546;
}
#choices-panel {
  position: absolute;
  left: 5%;
  top: 87px;
  width: 47%;
  max-height: calc(100% - 365px);
  min-height: 190px;
  overflow-y: auto;
  padding: 14px 18px 12px;
  background: #0a1b2bea;
  border: 1px solid #a4ada557;
  backdrop-filter: blur(12px);
  z-index: 2;
}
.choice-heading {
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 3px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
}
.choice-heading span {
  color: #819da8;
  letter-spacing: 1px;
}
#choices {
  display: grid;
  gap: 7px;
}
.choice-button {
  font-size: 14px;
  text-align: left;
  padding: 12px 14px;
  line-height: 1.5;
  display: flex;
  gap: 12px;
}
.choice-number {
  color: var(--gold);
  font: 13px Georgia;
  padding-top: 3px;
}
.choice-label {
  flex: 1;
}
details {
  margin-top: 12px;
  border-top: 1px solid var(--line);
  padding-top: 9px;
}
summary {
  cursor: pointer;
  color: #acbdc2;
  font-size: 12px;
}
details label {
  font-size: 12px;
}
.micro {
  font-size: 11px;
  color: #9eb0b6;
  margin: 9px 0;
  line-height: 1.6;
}
#action-submit {
  font-size: 12px;
}
#action-status {
  font-size: 12px;
  color: var(--gold);
  margin-top: 8px;
}
#ending-panel {
  position: absolute;
  left: 8%;
  top: 15%;
  max-width: 480px;
  border-left: 2px solid var(--gold);
  padding-left: 25px;
}
#ending-panel p {
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--gold);
}
#ending-panel h2 {
  font: 42px var(--serif);
  margin: 20px 0 24px;
  letter-spacing: 8px;
}
#ending-panel button {
  font-size: 12px;
  margin: 0 5px 8px 0;
}
dialog {
  width: min(650px, 92vw);
  max-height: 86dvh;
  border: 1px solid #84999488;
  background: #0c1d2af5;
  color: var(--ink);
  padding: 24px 30px;
  box-shadow: 0 30px 100px #0008;
}
dialog::backdrop {
  background: #020c16b5;
  backdrop-filter: blur(7px);
}
.modal-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 15px;
  margin-bottom: 20px;
}
.modal-heading h2 {
  font: 24px var(--serif);
  letter-spacing: 3px;
}
.modal-heading button {
  border: 0;
  background: transparent;
  font-size: 24px;
  padding: 0 8px;
}
.menu-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.row {
  display: flex;
  gap: 10px;
  margin: 15px 0;
  align-items: center;
}
.row > * {
  flex: 1;
}
.check {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}
.check input {
  width: 18px;
  height: 18px;
}
.help {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.8;
  margin: 14px 0;
}
.history-entry {
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}
.history-entry strong {
  color: var(--gold);
  font-weight: 400;
}
.history-entry p {
  font: 16px/1.9 var(--serif);
  margin-top: 7px;
}
.memory-entry {
  border: 1px solid var(--line);
  padding: 14px;
  margin-bottom: 12px;
}
.memory-entry small {
  color: var(--gold);
}
.memory-entry p {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.memory-entry button {
  font-size: 12px;
  margin-top: 8px;
  margin-right: 8px;
}
.memory-entry textarea {
  margin-top: 10px;
}
.profile-item {
  display: flex;
  gap: 10px;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
}
.profile-item button {
  font-size: 12px;
}
.fact {
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  line-height: 1.8;
  font-size: 14px;
}
#toast {
  position: absolute;
  z-index: 12;
  left: 50%;
  transform: translateX(-50%);
  top: 78px;
  max-width: 85%;
  width: max-content;
  background: #142e3df5;
  border: 1px solid var(--gold);
  padding: 12px 20px;
  font-size: 13px;
  box-shadow: 0 4px 30px #0008;
}
#storage-warning {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #67472c;
  color: #fff;
  padding: 6px 15px;
  z-index: 100;
  font-size: 12px;
}
.reduced * {
  animation: none !important;
  transition: none !important;
}
.branch-note {
  color: var(--gold);
  font-size: 12px;
  margin-bottom: 10px;
}
@keyframes drift {
  from {
    transform: translateX(-4%);
    opacity: 0.35;
  }
  to {
    transform: translateX(4%);
    opacity: 1;
  }
}
@keyframes arrive {
  from {
    opacity: 0;
    transform: translateY(9px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (max-height: 720px) and (min-width: 701px) {
  .topbar {
    height: 48px;
  }
  #title-screen,
  #game-screen {
    top: 48px;
  }
  .title-copy {
    top: 6%;
    left: 9%;
  }
  h1 {
    font-size: 57px;
    margin: 15px 0;
  }
  .title-subtitle {
    font-size: 14px;
    line-height: 1.6;
  }
  .title-rule {
    margin: 14px 0;
  }
  .title-actions {
    margin-top: 18px;
  }
  .title-actions > button {
    padding: 11px 18px;
  }
  .profile-link {
    margin-top: 8px;
  }
  .title-side p {
    margin-top: 45px;
  }
  .scene-caption {
    top: 16px;
  }
  #scene-label {
    font-size: 18px;
  }
  #portrait-card {
    top: 18px;
    right: 11%;
    height: calc(100% - 258px);
  }
  .dialogue {
    bottom: 49px;
    min-height: 169px;
    padding: 13px 23px 8px;
  }
  #story-text {
    font-size: 17px;
    line-height: 1.75;
  }
  .name-row {
    margin-bottom: 6px;
  }
  .text-continue {
    min-height: 82px;
  }
  .toolbar {
    bottom: 6px;
  }
  #choices-panel {
    top: 64px;
    max-height: calc(100% - 288px);
    min-height: 0;
    width: 54%;
    padding: 10px 12px;
  }
  .choice-heading {
    margin-bottom: 7px;
  }
  .choice-button {
    padding: 7px 10px;
    font-size: 13px;
  }
  #choices {
    gap: 5px;
  }
  #prop {
    top: 105px;
    font-size: 15px;
  }
  #ending-panel {
    top: 16%;
  }
  #ending-panel h2 {
    font-size: 34px;
    margin: 14px 0;
  }
  .dialogue-footer {
    margin-top: 2px;
  }
  .title-footer {
    bottom: 15px;
  }
}
@media (max-width: 700px) {
  #stage {
    min-height: 700px;
    max-height: none;
    height: 100dvh;
    overflow-y: auto;
  }
  .topbar {
    height: 52px;
    padding: 0 5%;
  }
  .topbar a {
    font-size: 10px;
    letter-spacing: 1px;
  }
  #chapter {
    display: none;
  }
  #title-screen,
  #game-screen {
    top: 52px;
  }
  .title-copy {
    left: 8%;
    top: 10%;
  }
  h1 {
    font-size: 65px;
    margin: 25px 0;
  }
  .title-subtitle {
    font-size: 15px;
  }
  .title-side {
    right: 10%;
    top: 14%;
  }
  .clock-mark {
    width: 63px;
    height: 63px;
    font-size: 23px;
  }
  .title-side p,
  .title-side > span {
    display: none;
  }
  .title-actions {
    flex-direction: column;
    max-width: 250px;
  }
  .title-footer {
    font-size: 9px;
    letter-spacing: 0;
  }
  .title-rule {
    margin: 23px 0;
  }
  .scene-caption {
    left: 6%;
    top: 20px;
    z-index: 1;
  }
  #scene-label {
    font-size: 19px;
  }
  #scene-sub {
    font-size: 9px;
  }
  #portrait-card {
    right: 7%;
    top: 75px;
    height: auto;
    width: 60%;
    max-height: 275px;
  }
  #prop {
    left: 7%;
    top: 130px;
    max-width: 143px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.8;
  }
  .dialogue {
    position: absolute;
    left: 4%;
    right: 4%;
    bottom: 59px;
    min-height: 225px;
    padding: 15px 16px 10px;
  }
  #story-text {
    font-size: 17px;
    line-height: 1.85;
    letter-spacing: 0.4px;
  }
  .text-continue {
    min-height: 135px;
  }
  .name-row {
    margin-bottom: 8px;
  }
  #node-counter {
    font-size: 9px;
  }
  #choices-panel {
    top: 83px;
    left: 4%;
    right: 4%;
    width: auto;
    max-height: calc(100% - 394px);
    min-height: 0;
    padding: 12px;
    background: #0b1e2bf5;
  }
  #choices-panel .choice-button {
    font-size: 13px;
    padding: 9px 10px;
  }
  .has-choices #portrait-card {
    opacity: 0.25;
  }
  .has-choices #prop {
    display: none;
  }
  #continue-hint {
    font-size: 10px;
  }
  #feedback-button {
    font-size: 10px;
  }
  #feedback-button span {
    display: none;
  }
  .toolbar {
    left: 3%;
    right: 3%;
    justify-content: space-between;
    bottom: 10px;
    gap: 0;
  }
  .toolbar button {
    padding: 10px 9px;
    font-size: 12px;
  }
  #ending-panel {
    top: 85px;
    left: 8%;
    right: 8%;
    padding-left: 18px;
  }
  #ending-panel h2 {
    font-size: 34px;
    margin: 16px 0;
  }
  #ending-panel button {
    font-size: 11px;
  }
  dialog {
    padding: 20px;
  }
  .menu-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  #toast {
    top: 61px;
    max-width: 92%;
    font-size: 12px;
  }
  .dialogue-footer {
    gap: 4px;
  }
}
@media (min-width: 701px) {
  #stage {
    height: min(100dvh, 56.25vw);
    margin-top: max(0px, calc((100dvh - 56.25vw) / 2));
  }
}
/* Persistence warnings occupy the header's status area, never the reading controls. */
#storage-warning {
  top: 0;
  bottom: auto;
  left: 28%;
  right: 17%;
  max-height: 46px;
  overflow: hidden;
  font-size: 10px;
  pointer-events: none;
}
@media (max-width: 700px) {
  #storage-warning {
    top: 52px;
    left: 4%;
    right: 4%;
    max-height: 45px;
  }
}
@media (max-width: 700px) {
  .title-side {
    display: none;
  }
}

/* Keep the approved reading layout, soften the daytime scene. */
.daytime .mist { opacity: 0; }
.daytime .veil { opacity: .45; }

/* Two independent slots. Body and face always move as one composited figure. */
#cast-stage { position: absolute; inset: 0; pointer-events: none; }

e":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"umbrella","cg":"umbrella-fight","transition":"strike","next":"rain_fight_011"},"rain_fight_011":{"node_id":"rain_fight_011","branch_id":"rain_fight","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"你的手！","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"umbrella","cg":"umbrella-fight","next":"rain_fight_012"},"rain_fight_012":{"node_id":"rain_fight_012","branch_id":"rain_fight","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"别回来。扶住他，快到门口去！","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"umbrella","cg":"umbrella-fight","next":"rain_fight_013"},"rain_fight_013":{"node_id":"rain_fight_013","branch_id":"rain_fight","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她松开开关，退上长椅。黑伞失了支撑，摊在水里，伞骨抽动着没能再合拢。屋檐下另外两把伞转向落水的铁片，我们趁机跑到对面。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"umbrella","cg":"umbrella-fight","next":"rain_after_001"},"rain_after_001":{"node_id":"rain_after_001","branch_id":"rain_after","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"让我看看。袖子都湿了，先把外套脱下来吧。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"rain_after_002"},"rain_after_002":{"node_id":"rain_after_002","branch_id":"rain_after","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"铁片划了一下，没伤到骨头。里面就有纱布，先用手帕压着。你帮我绑紧一点，我一只手不方便。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"rain_after_003"},"rain_after_003":{"node_id":"rain_after_003","branch_id":"rain_after","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我刚才应该早点提醒你的。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"rain_after_004"},"rain_after_004":{"node_id":"rain_after_004","branch_id":"rain_after","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"你把他推开的时候，我就看见了。已经很快了，别怪自己。先坐下缓口气，腿还在抖就别急着站起来。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"rain_after_005"},"rain_after_005":{"node_id":"rain_after_005","branch_id":"rain_after","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"这把折尺叫醒铃？刚才那把伞停住，就是因为它？","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"rain_after_006"},"rain_after_006":{"node_id":"rain_after_006","branch_id":"rain_after","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"嗯。那两根伞骨一合，你们就会被夹在里面。我撑开它们，你们才能钻出来，接头也露出来了。趁它合不上，把那里扳断，这把伞就追不过来了。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"rain_after_007"},"rain_after_007":{"node_id":"rain_after_007","branch_id":"rain_after","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"那你对着整所学校用一次，我们不就安全了？","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"rain_after_008"},"rain_after_008":{"node_id":"rain_after_008","branch_id":"rain_after","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"范围越大，我就越撑不住。刚才只让伞停了几秒，手已经在抖了。你看，手柄上的蓝灯也熄了，得等它重新亮起来。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"rain_after_009"},"rain_after_009":{"node_id":"rain_after_009","branch_id":"rain_after","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"知道了。以后她叫跑的时候，你就跑，别站在旁边问。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[{"name":"高桥夏希","motion":"nod"}],"facts":[],"next":"rain_after_010"},"rain_after_010":{"node_id":"rain_after_010","branch_id":"rain_after","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"我总不能看着她留在那儿吧。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"rain_after_011"},"rain_after_011":{"node_id":"rain_after_011","branch_id":"rain_after","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"entrance","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"可你站在那里，我也不敢走啊。下次先跟我过来，好不好？","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"nurse_room_001"},"nurse_room_001":{"node_id":"nurse_room_001","branch_id":"nurse_room","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我把手帕绕在学姐手臂上，让夏希帮着打好结。我们沿着干燥的一侧走到连廊尽头，保健室的门虚掩着。学姐先朝里面看了看，才示意我们跟上。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"nurse_room_002"},"nurse_room_002":{"node_id":"nurse_room_002","branch_id":"nurse_room","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"保健室里铺了三张床。白衣护士站在最里面，脸上的口罩一直连到发际，连眼睛的位置也没有缝。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"nurse","next":"nurse_room_003"},"nurse_room_003":{"node_id":"nurse_room_003","branch_id":"nurse_room","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"白衣护士","kind":"speech","text":"哪里受伤了？先过来躺好。那些事慢慢就忘了，忘了也就不疼了。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"nurse","next":"nurse_room_004"},"nurse_room_004":{"node_id":"nurse_room_004","branch_id":"nurse_room","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"学姐，你刚才进来的时候，她也在吗？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"nurse","next":"nurse_room_005"},"nurse_room_005":{"node_id":"nurse_room_005","branch_id":"nurse_room","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"我进来时这里没人。站门边，别靠床……我留的御守全被扯下来了，系绳还挂在床脚。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"nurse","next":"nurse_room_006"},"nurse_room_006":{"node_id":"nurse_room_006","branch_id":"nurse_room","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"那旁边那个人怎么办？他还躺着呢。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"nurse","next":"nurse_room_007"},"nurse_room_007":{"node_id":"nurse_room_007","branch_id":"nurse_room","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"靠窗的男生睁着眼，嘴唇一直动。护士每缠上一层绷带，他胸前的姓名牌就淡一点。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"nurse","next":"nurse_room_008"},"nurse_room_008":{"node_id":"nurse_room_008","branch_id":"nurse_room","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"白衣护士","kind":"speech","text":"别再叫他的名字。病人需要休息。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"nurse","next":"nurse_room_009"},"nurse_room_009":{"node_id":"nurse_room_009","branch_id":"nurse_room","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"他的名字快没了，再这样缠下去，连自己是谁都会忘。帮我按住床脚那张卡，别让它也消失。我来切绷带，药千万别接。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"nurse","next":"nurse_room_010"},"nurse_room_010":{"node_id":"nurse_room_010","branch_id":"nurse_room","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"悠，床脚太暗了，拿手机照一下。我看见班级了，兴许认得他。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"nurse","lore_unlocks":["nurse-rule"],"choices":[{"id":"card","text":"扶住床脚，把还看得清的名字念给夏希听。","next":"nurse_escape_001","tags":["relationship","investigation"],"effects":{"nurse":"remember"}},{"id":"medicine","text":"先接过护士的药，让她把绷带松开。","next":"bad_nurse_001","tags":["relationship"],"effects":{"nurse":"medicine"}}]},"nurse_escape_001":{"node_id":"nurse_escape_001","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"二年三班，山本……最后一个字看不清了。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"enemy":"nurse","next":"nurse_escape_002"},"nurse_escape_002":{"node_id":"nurse_escape_002","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"山本健太。上次运动会借过我们接力棒的那个。山本，你还记得吧？东西还在我们教室，没丢！","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"enemy":"nurse","next":"nurse_escape_003"},"nurse_escape_003":{"node_id":"nurse_escape_003","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"山本的手指蜷了一下，嘴唇也停住了。学姐趁机把醒铃插到床栏下面，往上一挑。绷带绷得笔直，护士伸出的手被拽住，停在了半空。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"enemy":"nurse","next":"nurse_escape_004"},"nurse_escape_004":{"node_id":"nurse_escape_004","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"就是现在，拉他！","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"enemy":"nurse","stage_effect":"shake","transition":"strike","next":"nurse_escape_005"},"nurse_escape_005":{"node_id":"nurse_escape_005","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我和夏希一人抓住一边，把他拖下床。护士的手落在空枕头上，绷带连着被单一起收紧。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"nurse_escape_006"},"nurse_escape_006":{"node_id":"nurse_escape_006","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"还能走吗？好，扶着我，别急。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"nurse_escape_007"},"nurse_escape_007":{"node_id":"nurse_escape_007","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"扶他去隔壁准备室，里面有人。护士只绕着病床走，先离开这间屋子！","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"nurse_escape_008"},"nurse_escape_008":{"node_id":"nurse_escape_008","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"学姐最后一个退出来，反手压住门。我以为她在听动静，走近了才发现，她一直没把气喘匀。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"nurse_escape_009"},"nurse_escape_009":{"node_id":"nurse_escape_009","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"我来扶一下。你先松松手。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"nurse_escape_010"},"nurse_escape_010":{"node_id":"nurse_escape_010","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"别按亮着的地方，扶门板就行……对。让我喘口气，我刚才险些跟着那个声音走了。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"nurse_escape_011"},"nurse_escape_011":{"node_id":"nurse_escape_011","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"她抵着门的手一直在抖。我还当她和我们不一样，听见这些声音也不会怕。她抬头发现我正看着，嘴角动了动，终于没有勉强挤出那个笑。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"nurse_escape_012"},"nurse_escape_012":{"node_id":"nurse_escape_012","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"门我先顶着。你靠墙歇一下，别老想着一个人把事都做了。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"nurse_escape_013"},"nurse_escape_013":{"node_id":"nurse_escape_013","branch_id":"nurse_escape","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"嗯。十秒就好。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"erased_student_001"},"erased_student_001":{"node_id":"erased_student_001","branch_id":"erased_student","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"storeroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我扶着山本穿过侧门。夏希在后面把门关紧，护士的脚步声停在了门外。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"erased_student_002"},"erased_student_002":{"node_id":"erased_student_002","branch_id":"erased_student","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"storeroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"准备室里坐着七八个学生，谁也没说话。山本靠着墙坐下，抬手指了指最里面的人。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"erased_student_003"},"erased_student_003":{"node_id":"erased_student_003","branch_id":"erased_student","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"storeroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"那人的右半边身体像没画完，铅笔屑一样的东西不断往下掉。她面前摊着一本名册，手指停在一块被擦白的地方。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"eraser","next":"erased_student_004"},"erased_student_004":{"node_id":"erased_student_004","branch_id":"erased_student","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"storeroom","time_label":"17:42","speaker":"无字学生","kind":"speech","text":"我坐哪儿……没人记得。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"eraser","next":"erased_student_005"},"erased_student_005":{"node_id":"erased_student_005","branch_id":"erased_student","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"storeroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"她也是被护士抓过的人？","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"eraser","next":"erased_student_006"},"erased_student_006":{"node_id":"erased_student_006","branch_id":"erased_student","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"storeroom","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"也许。你先退一点，别碰她。她连自己的身体都记不全了，会去找别人身上的东西补回来。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"enemy":"eraser","next":"erased_student_007"},"erased_student_007":{"node_id":"erased_student_007","branch_id":"erased_student","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"storeroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"这个发夹我见过。老师让我们搬旧照片的时候，有张合影上就有……好像放在那个抽屉里。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outf ttle"}},"cues":[],"facts":[],"next":"records_before_teacher_015"},"records_before_teacher_015":{"node_id":"records_before_teacher_015","branch_id":"records_before_teacher","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"storeroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"那就说好了，别到时候又改。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"records_before_teacher_016"},"records_before_teacher_016":{"node_id":"records_before_teacher_016","branch_id":"records_before_teacher","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"storeroom","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"嗯，说好了。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"records_before_teacher_017"},"records_before_teacher_017":{"node_id":"records_before_teacher_017","branch_id":"records_before_teacher","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"storeroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我合上登记册，一张照片从夹页里滑到地上。学姐先捡起来，看了一眼才递给我。照片上有辆撞歪的车，旁边的书包……怎么像是见过。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"records_before_teacher_018"},"records_before_teacher_018":{"node_id":"records_before_teacher_018","branch_id":"records_before_teacher","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"storeroom","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"先放进登记册。等换个安全的地方，我们一起看。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"records_before_teacher_019"},"records_before_teacher_019":{"node_id":" "}},"cues":[],"facts":[],"next":"morita_005"},"morita_005":{"node_id":"morita_005","branch_id":"morita","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"老师，你能看见那个值日生？","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"morita_006"},"morita_006":{"node_id":"morita_006","branch_id":"morita","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"hallway","time_label":"17:42","speaker":"森田老师","kind":"speech","text":"我看了他二十年，比你们熟悉一些。高桥，药带着吧？","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"morita_007"},"morita_007":{"node_id":"morita_007","branch_id":"morita","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"高桥同学，过来。他刚说不许外出，门牌就亮了，黑线也缠到门锁上了。在这里，他能把自己定的校规变成命令，逼着名单上的学生照做。","cast":{"right":{"name":"高桥夏希","expression":"angry","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"lore_unlocks":["teacher-rules"],"next":"morita_008"},"morita_008":{"node_id":"morita_008","branch_id":"morita","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"你们认识？","cast":{"right":{"name":"高桥夏希","expression":"angry","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"morita_009"},"morita_009":{"node_id":"morita_009","branch_id":"morita","route_label":"共同线","chapter":2,"chapter_title":"第二章 · 不要回头","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"见过几次。那时他也说自己会处理。现在准备室里还困着八个人，我得先带他们出去。森田老师，你要解释，我们出去以后慢慢听。","cast":{"right":{"name":"高桥夏希","expressio ,"facts":[],"next":"n_truth_008"},"n_truth_008":{"node_id":"n_truth_008","branch_id":"n_truth","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"那块牌子我也见过。放学时还想着问她要不要买，回去拿趟作业，竟连这件事也忘了。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_truth_009"},"n_truth_009":{"node_id":"n_truth_009","branch_id":"n_truth","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"再有印象，就是今天坐在教室里，看着你补作业。我当时还嫌你写得慢。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_truth_010"},"n_truth_010":{"node_id":"n_truth_010","branch_id":"n_truth","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"事故前后的记忆接不上，梦里又一直是这个下午。老师大概就是从这里动的手脚。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_truth_011"},"n_truth_011":{"node_id":"n_truth_011","branch_id":"n_truth","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"所以他才总问我梦见什么？","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_truth_012"},"n_truth_012":{"node_id":"n_truth_012","branch_id":"n_truth","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"有这个可能。你看手腕，那根线还通着门牌。他在这里写下的规定，能顺着线找到你。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_truth_013"},"n_truth_013":{"node_id":"n_truth_013","branch_id":"n_truth","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"那就把线弄断。刚才不是断过一次吗？","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_truth_014"},"n_truth_014":{"node_id":"n_truth_014","branch_id":"n_truth","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"断的是教室里的那一段。他手里的名单还留着你的名字，换个地方就能接回来。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_truth_015"},"n_truth_015":{"node_id":"n_truth_015","branch_id":"n_truth","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"明白了，得找到他手里的那头。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"choices":[{"id":"practice","text":"「先试试那把刀吧。真找到那根线，也得切得动才行。」","next":"n_practice_001","tags":["adventure"],"effects":{"n_plan":"blade"}},{"id":"records","text":"「去拿名单。总不能一直等他来抓人。」","next":"n_records_001","tags":["investigation"],"effects":{"n_plan":"ledger"}}]},"n_practice_001":{"node_id":"n_practice_001","branch_id":"n_practice","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"等一下，我想想刚才是怎么做的。你们都退远一点。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"battle"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_practice_002"},"n_practice_002":{"node_id":"n_practice_002","branch_id":"n_practice","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她刚站起，膝盖便一软，只好扶着床栏重新坐下。抬起的手没有放下，光从指缝里漏出来，先弯成一截歪线，又慢慢聚拢。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"battle"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_practice_003"},"n_practice_003":{"node_id":"n_practice_003","branch_id":"n_practice","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"怎么握不稳了？刚才明明一下就出来了。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"battle"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_practice_004"},"n_practice_004":{"node_id":"n_practice_004","branch_id":"n_practice","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"先别急着挥。看床头那张卡，写着“不许离床”。它在逼你留在床上，所以你一站起来就腿软。沿着卡片找那条发黑的细线，试着切断它。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"battle"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_practice_005"},"n_practice_005":{"node_id":"n_practice_005","branch_id":"n_practice","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"所以只要是他写的规定，都能砍掉？连明天交作业也算？","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"battle"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_practice_006"},"n_practice_006":{"node_id":"n_practice_006","branch_id":"n_practice","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"要是真行，先把我那份划了吧。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"battle"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_practice_007"},"n_practice_007":{"node_id":"n_practice_007","branch_id":"n_practice","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她笑着将刀贴近卡片，轻轻划了一下。卡片还好好的，通向床脚的细线却断了。她试着站起来，这回膝盖没再发软。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"battle"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[{"name":"高桥夏希","motion":"bob"}],"facts":[],"next":"n_practice_008"},"n_practice_008":{"node_id":"n_practice_008","branch_id":"n_practice","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"现在能站起来了吧？那条黑线把“不许离床”的规定施加在你身上。线一断，规定就管不到你了。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"battle"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"lore_unlocks":["cut-and-anchor"],"next":"n_practice_009"},"n_practice_009":{"node_id":"n_practice_009","branch_id":"n_practice","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"给它起个名字试试？我刚入行时也老弄丢标记，前辈就让我这样记。总比心里想着“刚才那个发光的东西”容易找。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"battle"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_practice_010"},"n_practice_010":{"node_id":"n_practice_010","branch_id":"n_practice","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"晚灯，怎么样？楼梯口那么暗，它一亮，我才看清学姐在哪儿。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"battle"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_practice_011"},"n_practice_011":{"node_id":"n_practice_011","branch_id":"n_practice","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"先把刀收起来，别一直撑着。去操场后面那条小河边等我，那边的标记还亮着。我找到图就过去，别往校外走。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"battle"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"lore_unlocks":["late-lamp"],"next":"n_prepare_001"},"n_records_001":{"node_id":"n_records_001","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"学姐带我们绕回办公室，从没锁好的窗边翻了进去。她贴住门缝，夏希才敢拉开老师的抽屉。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_records_002"},"n_records_002":{"node_id":"n_records_002","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"最上面几张还是试卷，掀开以后，底下全是按年份排好的学生照片。夏希翻到其中一张，手便停住了。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_records_003"},"n_records_003":{"node_id":"n_records_003","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"除了这一张，其他人我都没见过。后面盖的都是毕业的章，可这里明明还有一年级的。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_records_004"},"n_records_004":{"node_id":"n_records_004","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"前面还有一页，写着提取梦核的日期。这些人被他取走梦核以后，全都记成离校了。人不见了，其他人再翻名册，也只当他们早就毕业。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_records_005"},"n_records_005":{"node_id":"n_records_005","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"这张还没盖章。夏希，照片上的人是不是……","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_records_006"},"n_records_006":{"node_id":"n_records_006","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"先别翻。让我自己看。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_records_007"},"n_records_007":{"node_id":"n_records_007","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她把那张还没盖章的抽出来，翻到背面。名字已经填好了，是她的，只有日期那一栏空着。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_records_008"},"n_records_008":{"node_id":"n_records_008","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"拿上吧。回去让他自己解释。","cast":{"right":{"name":"高桥夏希","expression":"angry","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_records_009"},"n_records_009":{"node_id":"n_records_009","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"刚才你砍掉门牌，老师就没法在那段走廊没收我的武器了。可他手里还有名单，换个地方就能重新下令。得把你名字旁边那条黑线也切断。","cast":{"right":{"name":"高桥夏希","expression":"angry","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"lore_unlocks":["cut-and-anchor"],"next":"n_records_010"},"n_records_010":{"node_id":"n_records_010","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"刚才那把刀，想好怎么再叫出来了吗？起个名字会好记一些，醒铃也是这么来的。","cast":{"right":{"name":"高桥夏希","expression":"angry","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_records_011"},"n_records_011":{"node_id":"n_records_011","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"那就叫晚灯吧。刚才在楼梯口，靠它才找得到人。","cast":{"right":{"name":"高桥夏希","expression":"angry","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"n_records_012"},"n_records_012":{"node_id":"n_records_012","branch_id":"n_records","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"office","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"行。先去操场后面的小河边等我，那边的标记还亮着。我再看一眼出口，马上过去。","cast":{"right":{"name":"高桥夏希","expression":"angry","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"lore_unlocks":["late-lamp"],"next":"n_prepare_001"},"n_prepare_001":{"node_id":"n_prepare_001","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"穿过操场后的小桥，我们在河边坐下。教学楼就在树梢后面，窗边的御守还亮着，暂时看不见老师。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_002"},"n_prepare_002":{"node_id":"n_prepare_002","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"你还记得刚才那家面包店吗？车站旁边那家。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_003"},"n_prepare_003":{"node_id":"n_prepare_003","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"记得。你说第二个半价。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_004"},"n_prepare_004":{"node_id":"n_prepare_004","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"他家每周五换新品。我本来想今天跟你去，又怕你一听要排队就跑。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_005"},"n_prepare_005":{"node_id":"n_prepare_005","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"你叫我去买过几次东西，我跑过吗？","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_006"},"n_prepare_006":{"node_id":"n_prepare_006","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"上回排到一半，你去便利店买炒面面包了。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_007"},"n_prepare_007":{"node_id":"n_prepare_007","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"那次你说，随便哪种都行。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_008"},"n_prepare_008":{"node_id":"n_prepare_008","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"那是客气话。人都到店门口了，谁会真的想吃便利店那个啊。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_009"},"n_prepare_009":{"node_id":"n_prepare_009","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"我想起她那天看着纸袋发愣，问是不是卖完了。我还觉得自己省了不少时间。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_010"},"n_prepare_010":{"node_id":"n_prepare_010","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"那这次我陪你排，排多久都行。你想吃哪个？","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_011"},"n_prepare_011":{"node_id":"n_prepare_011","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"到了再挑。你要是嫌无聊就跟我说话，别又跑去别的店。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_012"},"n_prepare_012":{"node_id":"n_prepare_012","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她把鞋尖伸到树影外，轻轻碰了一下我的。刚才攥紧的手已经松开，搭在长椅中间。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_013"},"n_prepare_013":{"node_id":"n_prepare_013","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"那明天再去。今天肯定赶不上了。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_014"},"n_prepare_014":{"node_id":"n_prepare_014","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"明天那家店也开门。你不会睡过头吧？","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_015"},"n_prepare_015":{"node_id":"n_prepare_015","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"你定时间，我设闹钟。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_016"},"n_prepare_016":{"node_id":"n_prepare_016","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"那就十点，店门口见。我这次可不去路口接你了。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_017"},"n_prepare_017":{"node_id":"n_prepare_017","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"我转头看她。她也正看我，视线碰到一起，便先低下了头。我把挨着她的那只手往中间挪了挪。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"n_prepare_018"},"n_prepare_018":{"node_id":"n_prepare_018","branch_id":"n_prepare","route_label":"夏希线","chapter":3,"chapter_title":"第三章 · 走到明天","scene":"riverside","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"可是得先出去。刚才那把刀，我还没弄明白怎么叫出来。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"choices":[{ 章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"为什么还要把我们留在这里？","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_victory_020"},"n_victory_020":{"node_id":"n_victory_020","branch_id":"n_victory","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"我再看一遍名单。也许还有哪一页没拆下来。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_victory_021"},"n_victory_021":{"node_id":"n_victory_021","branch_id":"n_victory","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"刚才切断的时候，我又听见医院的声音了。只是一小会儿，接着又回到这里。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_victory_022"},"n_victory_022":{"node_id":"n_victory_022","branch_id":"n_victory","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她说完，窗外的夕光又停回熟悉的位置。老师倒下很久了，这次没有人碰过名单。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_victory_023"},"n_victory_023":{"node_id":"n_victory_023","branch_id":"n_victory","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我也想醒过来。可是每次回过神，你又坐在旁边。我就想着，那再待一会儿吧。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_victory_024"},"n_victory_024":{"node_id":"n_victory_024","branch_id":"n_victory","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"桌角的纸袋还在，连折痕都跟刚才一样。我把它攥进手里，想听见一点别的声音。太阳已经停得太久了。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"lore_unlocks":["borrowed-dream"],"next":"n_victory_025"},"n_victory_025":{"node_id":"n_victory_025","branch_id":"n_victory","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"她把纱布递过来，手停在半空，像忘了自己要做什么。我接住纱布，先替学姐按好伤口。谁也没有接着问，教室里只剩拆包装的窸窣声。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_last_001"},"n_last_001":{"node_id":"n_last_001","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"这些是刚才带出来的病历。我看到的都在这里了，你再看看吧。有看不懂的地方，我们一起找。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_last_002"},"n_last_002":{"node_id":"n_last_002","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我翻到最后，只有老师添的用药记录，再往前翻，检查日期也没变。我盯着几处看不懂的字，问了学姐两遍，答案还是一样。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_last_003"},"n_last_003":{"node_id":"n_last_003","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"先让其他人出去，让夏希继续睡呢？医院总还能想办法吧。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_last_004"},"n_last_004":{"node_id":"n_last_004","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"我试着断开过一个学生的名字，可他刚离开，旁边又补进来一个。老师接进来的梦还在维持这所学校。少了一个人，它就从外面再拉一个进来。我只能顺着连接慢慢解，留她这一段，其他人就出不去。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_last_005"},"n_last_005":{"node_id":"n_last_005","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"老师不是一直在治她？","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_last_006"},"n_last_006":{"node_id":"n_last_006","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"他在病历上记的全是做梦的时间，伤势一天比一天重，也没换过药。他知道她醒不过来，还要拖着，等梦核长成。最后那一页写的就是取出以后给自己用的剂量。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"lore_unlocks":["morita-harvest","borrowed-dream"],"next":"n_last_007"},"n_last_007":{"node_id":"n_last_007","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"学姐，先出去一下行吗？我想跟他说两句。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"n_last_008"},"n_last_008":{"node_id":"n_last_008","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"你别再翻了。刚才那页你看了三遍，字又不会变。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_last_009"},"n_last_009":{"node_id":"n_last_009","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"可能有我们看不懂的地方。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_last_010"},"n_last_010":{"node_id":"n_last_010","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"那就先放着，待会儿再看。悠，你抬一下头，我想跟你说话。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_last_011"},"n_last_011":{"node_id":"n_last_011","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我也想出去啊。刚才还在想明天穿哪双鞋，几点去车站等你。连排队的时候要说什么，都想了好几遍。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[{"name":"高桥夏希","motion":"step"}],"facts":[],"next":"n_last_012"},"n_last_012":{"node_id":"n_last_012","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"那就再等一会儿。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_last_013"},"n_last_013":{"node_id":"n_last_013","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"你再陪我坐一会儿吧。等我不那么害怕了，就叫学姐进来。楼下的人还等着回家，我们不能一直把他们留在这儿。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_last_014"},"n_last_014":{"node_id":"n_last_014","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"可这些事全是他干的，为什么到最后还要你来收拾。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_last_015"},"n_last_015":{"node_id":"n_last_015","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我也觉得不公平。可山本他们还在等，我已经跟他们说好会回去接了。你陪我把这件事做完，好不好？","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_last_016"},"n_last_016":{"node_id":"n_last_016","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"她说着这些，手还在轻轻发抖。我把本子放到桌上，握住她。现在连一句劝她的话都找不到了，只能靠近一点，让她有地方挨着。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_last_017"},"n_last_017":{"node_id":"n_last_017","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"明天我会去。就在店门口等，买你想吃的那个。我刚才还没问清楚，是哪一种？","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_last_018"},"n_last_018":{"node_id":"n_last_018","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"草莓奶油的，橱窗最右边。你可以买给自己吃，别又说不喜欢甜的。总得试一口才知道吧。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"n_last_019"},"n_last_019":{"node_id":"n_last_019","branch_id":"n_last","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"我低下头，把额头抵在她的手背上。她没有催我，只用拇指轻轻碰了一下我的头发。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"choices":[{"id":"goodbye","text":"握住她的手：「你准备好了，再告诉我。」","next":"n_dawn_001","tags":["relationship"],"effects":{"farewell":"listen"}},{"id":"breakfast","text":"「明天早上，我会去买你说的那个面包。」","next":"n_dawn_001","tags":["relationship"],"effects":{"farewell":"remember"}}]},"n_dawn_001":{"node_id":"n_dawn_001","branch_id":"n_dawn","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"明天记得买早饭，要早点去。你每次都说卖完了，其实就是起晚了。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_dawn_002"},"n_dawn_002":{"node_id":"n_dawn_002","branch_id":"n_dawn","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"嗯，我多设几个闹钟。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_dawn_003"},"n_dawn_003":{"node_id":"n_dawn_003","branch_id":"n_dawn","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她想笑一下，没笑出来。我把椅子挪近，让我们的膝盖碰在一起。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_dawn_004"},"n_dawn_004":{"node_id":"n_dawn_004","branch_id":"n_dawn","route_label":"夏希线","chapter":4,"chapter_title":"第四章 · 走到明天","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我还有一句话，本来想出去再说。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"n_dawn_005"},"n_dawn_005":{"node_id":"n_dawn_005","branch_id": er_title":"第三章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"悠？你先别进来，地上都是……","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"m_distress_007"},"m_distress_007":{"node_id":"m_distress_007","branch_id":"m_distress","route_label":"美咲线","chapter":3,"chapter_title":"第三章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她的话停在半截。肩头浮出一层发暗的重影，沿着头发往外散，校服的边缘也跟着晃。我眨了几次眼，仍分不清那片影子贴在她身上，还是正从她身体里往外走。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"veiled"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"stage_effect":"fracture","transition":"dread","next":"m_distress_008"},"m_distress_008":{"node_id":"m_distress_008","branch_id":"m_distress","route_label":"美咲线","chapter":3,"chapter_title":"第三章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"怎么突然这么暗……悠，你还在门口吗？","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"veiled"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"m_distress_009"},"m_distress_009":{"node_id":"m_distress_009","branch_id":"m_distress","route_label":"美咲线","chapter":3,"chapter_title":"第三章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"在，我在这儿。夏希，看这边。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"veiled"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"m_distress_010"},"m_distress_010":{"node_id":"m_distress_010","branch_id":"m_distress","route_label":"美咲线","chapter":3,"chapter_title":"第三章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"佐藤君，先别碰她。线已经扎进去了，你一拉，她会更疼。我来挡住老师。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"veiled"},"left":{"name":"小林美咲","ex
