rmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"翻过去。就这一页，别再动了。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-core","next":"m_endbattle_005"},"m_endbattle_005":{"node_id":"m_endbattle_005","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"老师猛地撤开木尺，想从床的另一侧绕过来。学姐用脚抵住床架，顺着名单伸出的光挑起醒铃，将那条正要缩回硬壳的连接卡在两节刻度之间。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-core","cg":"morita-core-fight","transition":"strike","next":"m_endbattle_006"},"m_endbattle_006":{"node_id":"m_endbattle_006","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"森田老师","kind":"speech","text":"你松手！断了它，里面的东西就都醒了！","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-core","cg":"morita-core-fight","next":"m_endbattle_007"},"m_endbattle_007":{"node_id":"m_endbattle_007","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"那你就好好看看，自己留了多少人在里面。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-core","cg":"morita-core-fight","next":"m_endbattle_008"},"m_endbattle_008":{"node_id":"m_endbattle_008","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"学姐扳下手柄，夹住黑线的两节金属尺合拢，像剪刀一样将线绞断。琥珀色的壳从里面裂开，老师捂住胸口，身后的木尺砸进地板。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-core","cg":"morita-core-fight","stage_effect":"fracture","next":"m_endbattle_009"},"m_endbattle_009":{"node_id":"m_endbattle_009","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"最后一根擦中了学姐的左臂。她靠着床栏跪下，把醒铃推到脚边。老师倒在对面，眼镜滑到手旁，没再伸手去捡。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"m_endbattle_010"},"m_endbattle_010":{"node_id":"m_endbattle_010","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"学姐，你的手！","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"m_endbattle_011"},"m_endbattle_011":{"node_id":"m_endbattle_011","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"别过来。你胸口还有一根，我用纸把它隔开。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"m_endbattle_012"},"m_endbattle_012":{"node_id":"m_endbattle_012","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她用右手握住御守，慢慢靠近夏希胸前的光。御守上的刻度一格格亮起，连着胸口的细线终于不再晃动。夏希疼得攥紧我，随后忽然松了口气。我低头看，她的手却比刚才更淡了。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"m_endbattle_013"},"m_endbattle_013":{"node_id":"m_endbattle_013","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"他已经倒了。为什么还是这样？","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"m_endbattle_014"},"m_endbattle_014":{"node_id":"m_endbattle_014","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"梦核撑着的那一段快结束了。现实里的伤……我还是没能替她治好。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"m_endbattle_015"},"m_endbattle_015":{"node_id":"m_endbattle_015","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"悠，扶我坐下吧。我站不动了。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"m_endbattle_016"},"m_endbattle_016":{"node_id":"m_endbattle_016","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"旁白","kind":"narration","text":"美咲靠在床边，伸出还能动的右手。夏希将手搭上去，慢慢坐下。床单被风掀起一个角，她看了一眼，又把目光转回悠身上。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle","pose":"wounded"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"cg":"misaki-rescue","transition":"fade","next":"m_endbattle_017"},"m_endbattle_017":{"node_id":"m_endbattle_017","br 26":{"node_id":"m_endbattle_026","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"好……先去接其他人。门还开着，我们得快一点。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"m_endbattle_027"},"m_endbattle_027":{"node_id":"m_endbattle_027","branch_id":"m_endbattle","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"走到门口，我又回头看了一眼。床上只有一角没压好的被单。我想着该替她拉平，直到学姐轻轻叫了我一声。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"next":"m_today_001"},"m_today_001":{"node_id":"m_today_001","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"旁白","kind":"narration","text":"后来，五点四十二分不再有什么特别。车站的钟每天都会走过那个刻度，天色照常暗下去，第二天又亮起来。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_002"},"m_today_002":{"node_id":"m_today_002","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"observation","text":"刚回来的那几天，我总在放学后看一眼窗边。学姐来找过两次，第一次还带着医院的绷带，第二次多买了一份晚饭。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_003"},"m_today_003":{"node_id":"m_today_003","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"thought","text":"她没有劝我吃，只坐在旁边把自己的那份吃完。饭凉透以后，我才打开盖子。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_004"},"m_today_004":{"node_id":"m_today_004","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"observation","text":"后来她拆了绷带，我陪她去医院取外套。路过面包店，她问我想吃哪种，我才发现，自己已经很久没认真看过柜台了。再后来，我们开始约着去买晚饭。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_005"},"m_today_005":{"node_id":"m_today_005","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"thought","text":"有一天，过了平时约好的时间，手机还没响。我把“明天还来吗”打好，又怕她正忙，删了半句。最后索性全发出去，盯着屏幕等她回答。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_006"},"m_today_006":{"node_id":"m_today_006","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"observation","text":"一个月后，我们约在商店街见面。我提前到了几分钟，站在旧书店外，看橱窗里换上的文库本。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_007"},"m_today_007":{"node_id":"m_today_007","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"小林美咲","kind":"speech","text":"看什么呢？我从路口就看见你了。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_008"},"m_today_008":{"node_id":"m_today_008","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"speech","text":"这本以前借给夏希看过，书页上还沾了点奶油。现在出新版了，连封面都换了。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_009"},"m_today_009":{"node_id":"m_today_009","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"小林美咲","kind":"speech","text":"想进去看看吗？我还没吃饭，先陪你逛一会儿也行。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_010"},"m_today_010":{"node_id":"m_today_010","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"speech","text":"那先去吃吧。我也没吃，进去以后又不知道什么时候才出来。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_011"},"m_today_011":{"node_id":"m_today_011","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"小林美咲","kind":"speech","text":"本来想出门前煎个蛋，结果锅先糊了。洗完出门，就这个时间了。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_012"},"m_today_012":{"node_id":"m_today_012","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"speech","text":"你消息里说快做好了，我还以为你已经吃完了。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_013"},"m_today_013":{"node_id":"m_today_013","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"小林美咲","kind":"speech","text":"后来决定不做了。别问了，我已经洗过锅了。","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_014"},"m_today_014":{"node_id":"m_today_014","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"thought","text":"我没忍住笑出了声。她瞪了我一眼，自己也笑。我刚才还怕见面以后不知道聊什么，原来连一只煎坏的蛋，也能这样说上半天。","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_015"},"m_today_015":{"node_id":"m_today_015","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"speech","text":"下次要是没吃，直接叫我吧。不用每次都说顺路。","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_016"},"m_today_016":{"node_id":"m_today_016","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"小林美咲","kind":"speech","text":"那你也主动一点啊。昨天手机都快没电了，我还一直拿着，想看你什么时候会问我。","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"m_today_017"},"m_today_017":{"node_id":"m_today_017","branch_id":"m_today","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"thought","text":"我抬起头，她正看着我。原来昨天等消息的也有她。我摸了摸口袋里的手机，忽然觉得自己那些删来删去的话，很该早一点发出去。","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"choices":[{"id":"join","text":"「上次说的训练，我想去。但我还有很多事不懂。」","next":"m_join_001","tags":["adventure","relationship"],"effects":{"m_future":"join"}},{"id":"company","text":"「今天能不能再陪我一会儿？训练的事，路上慢慢说。」","next":"m_join_001","tags":["relationship"],"effects":{"m_future":"together"}}]},"m_join_001":{"node_id":"m_join_001","branch_id":"m_join","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"小林美咲","kind":"speech","text":"那从最简单的开始。第一条，不要擅自越过搭档给你的标记。","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"m_join_002"},"m_join_002":{"node_id":"m_join_002","branch_id":"m_join","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"speech","text":"这条你还准备说多久？","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"m_join_003"},"m_join_003":{"node_id":"m_join_003","branch_id":"m_join","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"小林美咲","kind":"speech","text":"说到你记住。还有，在局里得叫我小林前辈，别让我在新人面前下不来台。","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"m_join_004"},"m_join_004":{"node_id":"m_join_004","branch_id":"m_join","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"speech","text":"现在呢？","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"cg":"bureau-ending","next":"m_join_005"},"m_join_005":{"node_id":"m_join_005","branch_id":"m_join","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"小林美咲","kind":"speech","text":"现在又没上班。你自己想。","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"cg":"bureau-ending","next":"m_join_006"},"m_join_006":{"node_id":"m_join_006","branch_id":"m_join","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"speech","text":"美咲？","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"cg":"bureau-ending","next":"m_join_007"},"m_join_007":{"node_id":"m_join_007","branch_id":"m_join","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"小林美咲","kind":"speech","text":"嗯，听见了。别叫一声就停，你刚才还想说什么？","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"cg":"bureau-ending","next":"m_join_008"},"m_join_008":{"node_id":"m_join_008","branch_id":"m_join","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"observation","text":"我们在面包店各挑了一个。出了店门，我把她那份递过去，手指碰到她，她没有让开。路口的提示音响了，我们却谁都没先走。","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"cg":"bureau-ending","next":"m_join_009"},"m_join_009":{"node_id":"m_join_009","branch_id":"m_join","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"旁白","kind":"narration","text":"绿灯还亮着，过街的人从身边走过去。美咲朝路口看了一眼，握住悠的手，等他走到自己身边，才一起迈下路沿。远处钟声响过，车轮也重新滚动起来。","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"cg":"bureau-ending","next":"m_join_010"},"m_join_010":{"node_id":"m_join_010","branch_id":"m_join","route_label":"美咲线","chapter":4,"chapter_title":"第四章 · 回到今天","scene":"bridge","time_label":"一个月后","speaker":"佐藤悠","kind":"thought","text":"走到路口，我问她明天几点有空。她说要看值班表，晚一点回消息。我点点头，把她的手握紧了些。这一次，我会先问她。","cast":{"left":{"name":"小林美咲","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"cg":"bureau-ending","is_ending":true,"ending_id":"today","ending_name":"回到今天","chapter_checkpoint":false},"y_hold_001":{"node_id":"y_hold_001","branch_id":"y_hold","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"先等等。我碰着她的时候，手就没有继续消失。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"y_hold_002"},"y_hold_002":{"node_id":"y_hold_002","branch_id":"y_hold","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"我看见了。可你自己的手也开始变淡了，先让我看一下。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"y_hold_003"},"y_hold_003":{"node_id":"y_hold_003","branch_id":"y_hold","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"看可以，但你先别掰我的手。刚才一松开，她的手指就快看不见了。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"y_hold_004"},"y_hold_004":{"node_id":"y_hold_004","branch_id":"y_hold","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"学姐翻过我的手，指尖压着我掌心里一条几乎看不见的线。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"y_hold_005"},"y_hold_005":{"node_id":"y_hold_005","branch_id":"y_hold","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"好，先握着，别再攥紧了。我用醒铃替你撑一会儿。你叫什么名字，抓着的人又是谁？说给我听。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"y_hold_006"},"y_hold_006":{"node_id":"y_hold_006","branch_id":"y_hold","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"infirmary","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"佐藤悠啊。抓着的是夏希，这我怎么会认错。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"y_hold_007"},"y_hold_007":{"node_id":"y_hold_007","branch_id":"y_hold","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"infirmary","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"干什么，点名啊？听起来好奇怪。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"y_hold_008"},"y_hold_008":{"node_id":"y_hold_008","branch_id":"y_hold","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"infirmary","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"总得确认他还认得你。佐藤君，你听她说话，眼睛也看着她，别去追墙上那些影子。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"}},"cues":[],"facts":[],"next":"y_hold_009"},"y_hold_009": scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"哪里？","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_small_004"},"y_small_004":{"node_id":"y_small_004","branch_id":"y_small","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"这里。昨天我还笑你写得挤，今天就只剩一个框了。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_small_005"},"y_small_005":{"node_id":"y_small_005","branch_id":"y_small","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"我盯了很久，竟然想不起来那一笔该往哪儿落。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_small_006"},"y_small_006":{"node_id":"y_small_006","branch_id":"y_small","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"可能被油蹭掉了。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_small_007"},"y_small_007":{"node_id":"y_small_007","branch_id":"y_small","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"你刚才看了半天才回答。别这样，我又不是看不出来。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_small_008"},"y_small_008":{"node_id":"y_small_008","branch_id":"y_small","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"她低头凑近那张纸，头发垂下来，扫着我的手背。我却盯着桌角。刚才明明把这些桌子推去堵门了，现在连沾着油的讲义都回到了老地方。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_small_009"},"y_small_009":{"node_id":"y_small_009","branch_id":"y_small","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"刚才学姐让你别再乱碰，你听见了吧？别想着背着我们再试一次。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_small_010"},"y_small_010":{"node_id":"y_small_010","branch_id":"y_small","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"听见了。我没想乱来。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_small_011"},"y_small_011":{"node_id":"y_small_011","branch_id":"y_small","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"你每次心里有事，都不看我。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_small_012"},"y_small_012":{"node_id":"y_small_012","branch_id":"y_small","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"我只好转过来。她就在触手可及的地方，眼睛、头发、袖口都看得清，我却还是不放心，低头又去看了一遍她的手。","cast":{"right":{"name":"高桥夏希","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"choices":[{"id":"truth","text":"「学姐说，可能是我刚才太用力了。我不想让你担心，才没说。」","next":"y_truth_001","tags":["relationship"],"effects":{"y_bond":"truth"}},{"id":"insist","text":"「是有点不舒服。可是一松手，你怎么办？我想再试试。」","next":"y_truth_001","tags":["relationship"],"effects":{"y_bond":"insist"}}]},"y_truth_001":{"node_id":"y_truth_001","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"先松一点，学姐留下的御守还亮着，我暂时不会消失。你把作业拉过来，我看看那个字还能不能补好。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_002"},"y_truth_002":{"node_id":"y_truth_002","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"可是你的手……","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_003"},"y_truth_003":{"node_id":"y_truth_003","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我知道，你怕一松就没了。可你连自己的名字都快认不出了，总得先管管自己吧？来，照着我写一遍。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_004"},"y_truth_004":{"node_id":"y_truth_004","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她在旁边慢慢写了一遍，我照着描。最后那一笔落下去，那个陌生的字才忽然变回自己的名字。我盯着它看了好久，手心全是汗。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_005"},"y_truth_005":{"node_id":"y_truth_005","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"你是不是觉得我很蠢？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_006"},"y_truth_006":{"node_id":"y_truth_006","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"现在还没有。再瞒我一次就不好说了。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_007"},"y_truth_007":{"node_id":"y_truth_007","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"她把写好的那张纸折起来，放进我的胸前口袋。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_008"},"y_truth_008":{"node_id":"y_truth_008","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她替我按好口袋，收手时擦过我的手背。我跟着伸过去，轻轻握住她。刚才只顾着怕她消失，这时候才觉得不好意思。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_009"},"y_truth_009":{"node_id":"y_truth_009","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"还抓？不是让你先歇一会儿吗？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_010"},"y_truth_010":{"node_id":"y_truth_010","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"我没再用力，就是想牵一会儿……你往这边坐一点，好不好？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_011"},"y_truth_011":{"node_id":"y_truth_011","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"随你吧。可是你手心全是汗，待会儿得让我擦一下。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_012"},"y_truth_012":{"node_id":"y_truth_012","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"她的呼吸渐渐平稳，我也跟着慢下来。窗帘擦过桌角，和以前值日到最后一样。楼下还有人敲门，声音一远，我就忍不住想着，要是今天真只是放学晚了，该多好。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_013"},"y_truth_013":{"node_id":"y_truth_013","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"夏希握着我的手，窗上的倒影却没有握着我。倒影背后有黑色的薄片，沿着肩头一层层展开。","cast":{"right":{"name":"高桥夏希","expression":"smile","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_014"},"y_truth_014":{"node_id":"y_truth_014","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"别看窗户……我刚才也看见了。","cast":{"right":{"name":"高桥夏希","expression":"lucid","outfit":"nightmare"}},"cues":[],"facts":[],"transition":"dread","next":"y_truth_015"},"y_truth_015":{"node_id":"y_truth_015","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"你的肩膀，怎么也……","cast":{"right":{"name":"高桥夏希","expression":"lucid","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_truth_016"},"y_truth_016":{"node_id":"y_truth_016","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她低头，手臂上的裂口随之合拢。窗外的夕阳暗了一瞬，桌脚那枚御守也同时晃了一下。她一松手，它们又退回原处。","cast":{"right":{"name":"高桥夏希","expression":"lucid","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_truth_017"},"y_truth_017":{"node_id":"y_truth_017","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我没有想弄坏它。可我刚才一怕，这里就跟着动。","cast":{"right":{"name":"高桥夏希","expression":"lucid","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_truth_018"},"y_truth_018":{"node_id":"y_truth_018","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"脚步声停在门口。学姐看见桌脚的御守，蹲下来确认了一遍，才将怀里的薄册子翻开。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_019"},"y_truth_019":{"node_id":"y_truth_019","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"我找到老师夹起来的那一册了。他从你入学以前就在查，这上面写着，你家里有人和梦魇共同生活过。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_020"},"y_truth_020":{"node_id":"y_truth_020","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"所以我也……是那种东西？","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"lore_unlocks":["inherited-dream"],"next":"y_truth_021"},"y_truth_021":{"node_id":"y_truth_021","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"你身上有两边的血。之前只凭车祸后的梦，我不敢这么说。现在这些记录，和刚才房间跟着你变化的样子，对上了。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_022"},"y_truth_022":{"node_id":"y_truth_022","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"那老师倒下，梦也不会结束？","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_023"},"y_truth_023":{"node_id":"y_truth_023","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"他接手以前，这间教室就有了。梦是从她这里开始的。老师只是把本来很小的梦接到了整所学校。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"lore_unlocks":["natsuki-origin","afternoon-wish"],"next":"y_truth_024"},"y_truth_024":{"node_id":"y_truth_024","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我只记得出事的时候，还想回来找你。哪知道醒过来以后，真的又坐到了这里。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_025"},"y_truth_025":{"node_id":"y_truth_025","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我想说点什么，学姐却先合上了本子。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_026"},"y_truth_026":{"node_id":"y_truth_026","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"我去接出口。你们留在这里，暂时别再用力了。","cast":{"left":{"name":"小林美咲","expression":"worried","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_027"},"y_truth_027":{"node_id":"y_truth_027","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"出事的时候，我一直想回教室。就是现在这样，你还在补作业，我坐在旁边，还来得及把话说完。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_028"},"y_truth_028":{"node_id":"y_truth_028","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"你想说什么？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_029"},"y_truth_029":{"node_id":"y_truth_029","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我每天等你，连回家都要绕那么远，你真觉得是顺路啊？我找借口找得自己都快信了，你就一次也没想过问我？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_030"},"y_truth_030":{"node_id":"y_truth_030","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"她偏过头，好像说完就有点后悔。我却想起每次快到路口，自己也会越走越慢。原来那时只要问一句，可能就不用各自回家再想半天。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_031"},"y_truth_031":{"node_id":"y_truth_031","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"想问啊。可你万一说，真的只是顺路呢？我连第二天还叫不叫你一起走，都不知道了。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_032"},"y_truth_032":{"node_id":"y_truth_032","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她把脸转向窗户。我握紧一点，她才小声笑出来。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_033"},"y_truth_033":{"node_id":"y_truth_033","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"那你还真能忍。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_truth_034"},"y_truth_034":{"node_id":"y_truth_034","branch_id":"y_truth","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"楼下又响了几声，我的肩膀一下绷紧。迟早得出去，我知道。可夏希还靠着我，手也没松。我竟有点怨起敲门的人，怎么偏偏在这时候叫我们。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_terms_001"},"y_terms_001":{"node_id":"y_terms_001","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"敲门声换到了身后。学姐站在教室门口，怀里夹着封锁图。我陪夏希出去，她把从办公室带来的收音机放在窗台上，声音调低，只留下断断续续的报时。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_002"},"y_terms_002":{"node_id":"y_terms_002","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她把图摊在旁边，指着新添的几条线。楼下忽然有人喊起来，一间原本空着的教室里也传出了拍门声。学姐朝那边看了一眼，手指按得更紧。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_003"},"y_terms_003":{"node_id":"y_terms_003","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"刚才你们往门口走，我在这里试着接出口。高桥同学一离开窗边，线就往教室里缩……你看，森田的图上也是这几处，他试过好几回。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_004"},"y_terms_004":{"node_id":"y_terms_004","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"是我把它拉回去了？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_005"},"y_terms_005":{"node_id":"y_terms_005","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"你自己大概也没察觉。医院里的你醒不了，梦就总往这个下午退。刚才那本记录也写了，最初只重复出现两张桌子。森田后来才把名单接进去，变成整所学校。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_006"},"y_terms_006":{"node_id":"y_terms_006","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我只是想再跟他说句话……怎么连他们也回不了家了。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_007"},"y_terms_007":{"node_id":"y_terms_007","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"她那时候又不知道会发生什么。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_008"},"y_terms_008":{"node_id":"y_terms_008","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"我明白，你那时候也不知道这些。可楼下又多了人，我们得先送他们出去。走吧，边走边说，别让他们在门口等。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_009"},"y_terms_009":{"node_id":"y_terms_009","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"局里遇到过这样的梦。人待在里面，身体就跟着梦撑下去，一时饿不死，也渴不死。可梦一天不结束，外面的人就一天叫不醒他们。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"lore_unlocks":["dream-life"],"next":"y_terms_010"},"y_terms_010":{"node_id":"y_terms_010","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"那夏希也能这样活着吧？只是……外面还会继续有人进来？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_011"},"y_terms_011":{"node_id":"y_terms_011","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"会。所以森田才封住学校，等梦核长成再取走。他自己也怕撑不住，连他一起被吞进去。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_012"},"y_terms_012":{"node_id":"y_terms_012","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"森田老师","kind":"speech","text":"还要谈多久？楼下又添了几个，你们没听见吗？别再带着她乱走，她每动一步，我就得重新接一条线。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_terms_013"},"y_terms_013":{"node_id":"y_terms_013","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"你的记录我看过了，几十年没敢停药，对吧？一睡着，身体里的梦魇就会醒。你拿学生的梦核给自己续着，还跟她说是在治病？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"lore_unlocks":["morita-secret"],"next":"y_terms_014"},"y_terms_014":{"node_id":"y_terms_014","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"森田老师","kind":"speech","text":"那你能接管整个学校吗？你刚才连一条走廊都没守住。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_015"},"y_terms_015":{"node_id":"y_terms_015","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"我能撑到他们出去。你守住边界，我来开门，把人一个个送走。别再碰他们的名字，也别打高桥同学的主意。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_016"},"y_terms_016":{"node_id":"y_terms_016","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"等一下。你们把人全送走，然后结束梦……夏希呢，她到时候怎么办？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_017"},"y_terms_017":{"node_id":"y_terms_017","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"她也会跟着梦一起消失。我查过病历，也试过单独接她的出口……佐藤君，我实在找不到别的路了。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_018"},"y_terms_018":{"node_id":"y_terms_018","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"再看看行不行？总有还没查完的吧，我们连今天到底过了多久都不知道，怎么就确定救不了她了？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_019"},"y_terms_019":{"node_id":"y_terms_019","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"你带回去看吧，图也拿着。我先开门。楼下已经有人站不住了……再等下去，我怕连他们都送不出去。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"next":"y_terms_020"},"y_terms_020":{"node_id":"y_terms_020","branch_id":"y_terms","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"楼下的敲门声一声比一声轻。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle"}},"cues":[],"facts":[],"choices":[{"id":"discuss","text":"「让我跟她说。你们别趁我不在的时候动手。」","next":"y_betrayal_001","tags":["relationship"],"effects":{"y_terms":"speak"}},{"id":"verify","text":"「名单给我看看。我要先确认山本他们都在上面。」","next":"y_betrayal_001","tags":["investigation"],"effects":{"y_terms":"verify"}}]},"y_betrayal_001":{"node_id":"y_betrayal_001","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我们沿楼梯来到一楼。学姐把最后一枚御守系在门框上，外面的街道慢慢显出来。几个学生扶着彼此往门边走，老师却在这时候翻开名册，按住夏希的名字。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_betrayal_002"},"y_betrayal_002":{"node_id":"y_betrayal_002","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"先把手拿开。人还在门里面，你现在动封锁，他们会被夹住！","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_betrayal_003"},"y_betrayal_003":{"node_id":"y_betrayal_003","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"森田老师","kind":"speech","text":"她的梦核已经撑到这里了。你开你的门，我把多余的部分取走。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_betrayal_004"},"y_betrayal_004":{"node_id":"y_betrayal_004","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"老师，好疼……你在拉什么？","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_betrayal_005"},"y_betrayal_005":{"node_id":"y_betrayal_005","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"一根黑线从夏希领口绷出来。她捂住胸口，膝盖撞上台阶，身后的影子却还站着。老师把笔尖往名字上一压，影子便猛地张开。","cast":{"left":{"name":"小林美咲","expression":"neutral","outfit":"battle"},"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_betrayal_006"},"y_betrayal_006":{"node_id":"y_betrayal_006","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"悠，我的手……我把它放下了，为什么它还在动？","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"transition":"dread","next":"y_betrayal_007"},"y_betrayal_007":{"node_id":"y_betrayal_007","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"门外有三个刚结束社团活动的学生。其中一个还推着自行车，头忽然垂了下去。车倒在街上，人却朝门里跌来。我伸手接住他，手里只抓到半截书包带。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_betrayal_008"},"y_betrayal_008":{"node_id":"y_betrayal_008","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"田中？你们怎么也进来了！","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_betrayal_009"},"y_betrayal_009":{"node_id":"y_betrayal_009","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"别进来！我没叫你们……快回去，别看这边！","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_betrayal_010"},"y_betrayal_010":{"node_id":"y_betrayal_010","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"森田，停下！她在把外面的人拉进来，你再抽下去，边界会全开！","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_betrayal_011"},"y_betrayal_011":{"node_id":"y_betrayal_011","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"森田老师","kind":"speech","text":"那就帮我按住她。我已经取到一半，现在松手，谁来收拾？","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_betrayal_012"},"y_betrayal_012":{"node_id":"y_betrayal_012","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"不要再拉了……我求你，你先停一下。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_betrayal_013"},"y_betrayal_013":{"node_id":"y_betrayal_013","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"靠近门口的玻璃一齐裂开。夏希拼命把手往身后藏，肩头的黑色薄片却顺着走廊伸出去。田中的鞋底擦过地面，眼看就要被拖到老师脚下。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"stage_effect":"fracture","next":"y_betrayal_014"},"y_betrayal_014":{"node_id":"y_betrayal_014","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我抓住夏希的手腕，想把她拉离那根线。她转过来看我，眼睛里已经找不到瞳孔；背后一片薄刃擦过我的肩，我被推得撞上墙。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_betrayal_015"},"y_betrayal_015":{"node_id":"y_betrayal_015","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"佐藤君，别靠近！把田中扶到挂着御守的门边！","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_betrayal_016"},"y_betrayal_016":{"node_id":"y_betrayal_016","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"学姐横过醒铃，绞断了名册旁最粗的黑线。老师往后退了两步，手指还捏着断口。夏希的身体终于不再被他往前拖，伸向门外的暗影却没有收回来。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"stage_effect":"flash","next":"y_betrayal_017"},"y_betrayal_017":{"node_id":"y_betrayal_017","branch_id":"y_betrayal","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"收不回来了……悠，它还在往外走。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_rampage_001"},"y_rampage_001":{"node_id":"y_rampage_001","branch_id":"y_rampage","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"田中靠在门框边，叫不醒。我把他的脚挪进蓝线，夏希的影子就追了过来。学姐用醒铃抵住那片薄刃，手柄上的刻度从头亮到尾。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_rampage_002"},"y_rampage_002":{"node_id":"y_rampage_002","branch_id":"y_rampage","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"高桥同学，听得见吗？看着我，先别管门外。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_rampage_003"},"y_rampage_003":{"node_id":"y_rampage_003","branch_id":"y_rampage","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我在看……可你怎么一会儿在这边，一会儿又在那边？","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_rampage_004"},"y_rampage_004":{"node_id":"y_rampage_004","branch_id":"y_rampage","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她的声音从走廊两头同时传来。楼梯上凭空多出一排课桌，桌边坐着刚才还站在街上的学生。一个女生睁开眼，发现自己换了地方，立刻哭起来。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_rampage_005"},"y_rampage_005":{"node_id":"y_rampage_005","branch_id":"y_rampage","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"夏希，先看我。我在这里，没走。","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"rage","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_rampage_006"},"y_rampage_006":{"node_id":"y_rampage_006","branch_id":"y_rampage","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我听见你了。你别再过来，我刚才碰到你了，对不对？","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"lucid","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_rampage_007"},"y_rampage_007":{"node_id":"y_rampage_007","branch_id":"y_rampage","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"衣服划破了，我没事。你能不能跟着我，把手放下来？","cast":{"left":{"name":"小林美咲","expression":"serious","outfit":"battle"},"right":{"name":"高桥夏希","expression":"lucid","outfit":"nightmare"}},"cues":[],"facts":[],"next":"y_rampage_008"},"y_rampage_008":{"node_id":"y_rampage_008","branch_id":"y_rampage","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她低下头，手指一点点松开。我以为终于停住了，老师却突然拽紧名册 回去，双手压在膝盖上。学姐看着她，像是还想确认什么，手指在御守的刻度上动了一下。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"cg":"misaki-sacrifice","next":"y_farewell_011"},"y_farewell_011":{"node_id":"y_farewell_011","branch_id":"y_farewell","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"学姐？你刚才数到二了。后面呢，你接着说。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"cg":"misaki-sacrifice","next":"y_farewell_012"},"y_farewell_012":{"node_id":"y_farewell_012","branch_id":"y_farewell","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"小林美咲","kind":"speech","text":"佐藤君……先听她说完。别又让她一个人等着。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"cg":"misaki-sacrifice","next":"y_farewell_013"},"y_farewell_013":{"node_id":"y_farewell_013","branch_id":"y_farewell","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"醒铃完全落进我怀里。我握住她的手腕，等她再看我一眼，她却没有抬头。夏希还在旁边点头，过了一会儿，才小声问我为什么不叫她。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"小林美咲","expression":"worried","outfit":"battle","pose":"wounded"}},"cues":[],"facts":[],"cg":"misaki-sacrifice","next":"y_farewell_014"},"y_farewell_014":{"node_id":"y_farewell_014","branch_id":"y_farewell","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"刚才她明明可以……她把刀挪开了。我看见了，她是听见我说话才停的。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"y_farewell_015"},"y_farewell_015":{"node_id":"y_farewell_015","branch_id":"y_farewell","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"我也看见了。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"y_farewell_016"},"y_farewell_016":{"node_id":"y_farewell_016","branch_id":"y_farewell","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"那我为什么还……我都已经认出她了，为什么手还不肯停？","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"y_farewell_017"},"y_farewell_017":{"node_id":"y_farewell_017","branch_id":"y_farewell","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"她把沾着血的手缩进袖子，越擦越脏。我想把她的手拿出来，伸到一半，还是先替学姐合上了睁着的眼睛。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"y_farewell_018"},"y_farewell_018":{"node_id":"y_farewell_018","branch_id":"y_farewell","route_label":"最终线","chapter":3,"chapter_title":"第三章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"出口还亮着。几个学生扶起田中，绕过我们往门外走。老师站在楼梯旁，手里那本名册一页也没有少。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"lore_unlocks":["misaki-hesitation"],"next":"y_weapon_001"},"y_weapon_001":{"node_id":"y_weapon_001","branch_id":"y_weapon","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"森田老师","kind":"speech","text":"都看见了吧。小林想保住她，现在连自己也没能出去。佐藤，把高桥带过来，趁她还听得见。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_weapon_002"},"y_weapon_002":{"node_id":"y_weapon_002","branch_id":"y_weapon","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"悠，别拉我了。我会再伤到你的。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_weapon_003"},"y_weapon_003":{"node_id":"y_weapon_003","branch_id":"y_weapon","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"森田老师","kind":"speech","text":"她自己都明白。把手放到名单上，我会让这些东西停下来。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_weapon_004"},"y_weapon_004":{"node_id":"y_weapon_004","branch_id":"y_weapon","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"学姐就坐在门边，领带还压在她伤口上。我看了很久，等不到她再伸手接醒铃。夏希也在看她，脚却已经朝老师那边挪了半步。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_weapon_005"},"y_weapon_005":{"node_id":"y_weapon_005","branch_id":"y_weapon","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"夏希，先停下。你答应过她，别再自己乱动。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_weapon_006"},"y_weapon_006":{"node_id":"y_weapon_006","branch_id":"y_weapon","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她停住了。我伸手去拉她，她立刻把手藏到背后，肩膀缩得很紧。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_weapon_007"},"y_weapon_007":{"node_id":"y_weapon_007","branch_id":"y_weapon","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我刚才杀了人。是学姐，悠，你也看见了。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_weapon_008"},"y_weapon_008":{"node_id":"y_weapon_008","branch_id":"y_weapon","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"我知道。你先把手给我。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_weapon_009"},"y_weapon_009":{"node_id":"y_weapon_009","branch_id":"y_weapon","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"她没有伸过来。我把手留在那里，自己也在抖。学姐回不来了，再怎么说对不起也没有用。可老师还拿着那支笔，我不能再看着他把她拖过去。","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_weapon_010"},"y_weapon_010":{"node_id":"y_weapon_010","branch_id":"y_weapon","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"刚才是你一直拉着她。现在又想让她照着你说的做，还要抽走多少才肯停？","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"next":"y_weapon_011"},"y_weapon_011":{"node_id":"y_weapon_011","branch_id":"y_weapon","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"森田老师","kind":"speech","text":"你能让她收住吗？她再往外走一步，又会有几个人进来。你护着她，他们怎么办？","cast":{"right":{"name":"高桥夏希","expression":"sad","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"choices":[{"id":"sever","text":"「夏希，先送大家出去吧。剩下的事，我陪你一起。」","next":"y_release_001","tags":["relationship"],"effects":{"y_final":"release"}},{"id":"refuse","text":"握住她藏在身后的手，展开醒铃：「别再碰她。」","next":"y_awaken_001","tags":["adventure","relationship"],"effects":{"y_final":"defy"}}]},"y_release_001":{"node_id":"y_release_001","branch_id":"y_release","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我抱着醒铃回到教室，照着学姐留下的次序接好最后一段标记。蓝光从门口一直延到楼梯下，学生们互相搀扶着，慢慢走向出口。我站在门边数着，楼梯下还有几个人没跟上。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_release_002"},"y_release_002":{"node_id":"y_release_002","branch_id":"y_release","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"先送他们出去吧。学姐好不容易把门打开，别让它关上了。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_release_003"},"y_release_003":{"node_id":"y_release_003","branch_id":"y_release","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"可是我不想让你也……","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_release_004"},"y_release_004":{"node_id":"y_release_004","branch_id":"y_release","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我知道。你送完他们，回来陪我坐一会儿，好不好？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"y_release_005"},"y_release_005":{"node_id":"y_release_005","branch_id":"y_release","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"等最后一个人走过，我把标记压牢，终于能松开醒铃。夏希就在窗边等我，见我回来，伸手把旁边的椅子拉了出来。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"n_dawn_001"},"y_awaken_001":{"node_id":"y_awaken_001","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"森田老师","kind":"speech","text":"连她都拿不住的东西，你想拿来做什么？放下。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","next":"y_awaken_002"},"y_awaken_002":{"node_id":"y_awaken_002","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"老师的木尺从墙上伸过来。我本能地举起醒铃，第一下就被震得手指发麻，差点让它脱手。夏希缩在我身后，两只手紧紧绞在一起。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","next":"y_awaken_003"},"y_awaken_003":{"node_id":"y_awaken_003","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"虎口疼得握不住，胳膊还在抖。才跑了几层楼，我的腿就开始发软，怎么会觉得捡起学姐的武器就能挡住他？可往后一退，夏希就在我背后。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","next":"y_awaken_004"},"y_awaken_004":{"node_id":"y_awaken_004","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"悠，退回来！","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","next":"y_awaken_005"},"y_awaken_005":{"node_id":"y_awaken_005","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我往后跌了一步，胸前的纸抵到肋骨。是夏希让我写的名字，最后一笔还没干透就折起来了。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","next":"y_awaken_006"},"y_awaken_006":{"node_id":"y_awaken_006","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"夏希，叫我的名字。你刚才还能跟着我松手，对吧？这次换你帮我，别让我忘了自己是谁。","cast":{"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"},"left":{"name":"森田老师","expression":"neutral","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","next":"y_awaken_007"},"y_awaken_007":{"node_id":"y_awaken_007","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"旁白","kind":"narration","text":"刻度依然暗着，悠的指缝间却渗出了蓝光。光沿手腕爬上去，地上的影子随之缺了一截。他疼得屈起手指，长杆在掌心转了半圈，竟映出了墙上黑线之间细小的空隙。","cast":{"left":{"name":"佐藤悠","expression":"neutral","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","cg":"yu-awaken","lore_unlocks":["anchor-awaken"],"transition":"transform","next":"y_awaken_008"},"y_awaken_008":{"node_id":"y_awaken_008","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"这些线……刚才全挤在一起，现在竟分得开了。通向教室的细一些，绕回老师脚边的那根最粗。那里缺了一小截，正好是学姐拦住老师、替夏希断开牵引时留下的地方。","cast":{"left":{"name":"佐藤悠","expression":"neutral","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","cg":"yu-awaken","next":"y_awaken_009"},"y_awaken_009":{"node_id":"y_awaken_009","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"你还想把那里接回去？学姐刚才都把它断开了。","cast":{"left":{"name":"佐藤悠","expression":"neutral","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","cg":"yu-awaken","next":"y_awaken_010"},"y_awaken_010":{"node_id":"y_awaken_010","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"森田老师","kind":"speech","text":"不接上，外面的人也得进来。把手松开，你连抓住了什么都不知道！","cast":{"left":{"name":"佐藤悠","expression":"neutral","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","cg":"yu-awaken","next":"y_awaken_011"},"y_awaken_011":{"node_id":"y_awaken_011","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我把醒铃抵进那道窄缝，拼命想着它现在的样子。像门把那时候一样，只要让它暂时别动。老师向后一拽，线绷直了，断口却还隔着那一点距离。","cast":{"left":{"name":"佐藤悠","expression":"neutral","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","stage_effect":"anchor","next":"y_awaken_012"},"y_awaken_012":{"node_id":"y_awaken_012","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"它停了！悠，真的停了！","cast":{"left":{"name":"佐藤悠","expression":"neutral","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","next":"y_awaken_013"},"y_awaken_013":{"node_id":"y_awaken_013","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"旁边几根线突然压下来，贴住我的手腕。每碰到一根，就有一个陌生名字挤进脑子。我回头找夏希，竟把墙上的影子也认成了她。","cast":{"left":{"name":"佐藤悠","expression":"neutral","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","next":"y_awaken_014"},"y_awaken_014":{"node_id":"y_awaken_014","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"不能再多了。先松手，把旁边这些放开。学姐说过只顾一处……我怎么又忘了。","cast":{"left":{"name":"佐藤悠","expression":"weary","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","next":"y_awaken_015"},"y_awaken_015":{"node_id":"y_awaken_015","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"你看我！你叫佐藤悠，这个名字还是我陪你写的！","cast":{"left":{"name":"佐藤悠","expression":"weary","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","next":"y_awaken_016"},"y_awaken_016":{"node_id":"y_awaken_016","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"……我知道。纸还在，没掉。","cast":{"left":{"name":"佐藤悠","expression":"weary","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"afraid","outfit":"school"}},"cues":[],"facts":[],"enemy":"morita-nightmare-v3","next":"y_awaken_017"},"y_awaken_017":{"node_id":"y_awaken_017","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"hallway","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"我一点点挪开醒铃，让通向教室的线从杆上滑过去，最后只抵着老师脚边那根。杂乱的声音终 en","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"外面也有人睡过去了？是因为我们还没出去吗？","cast":{"left":{"name":"佐藤悠","expression":"weary","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"y_awaken_027"},"y_awaken_027":{"node_id":"y_awaken_027","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"嗯。老师的封锁没了，梦又没有停，就往外去了。学姐刚才说的时候，我听见了……我知道会这样。","cast":{"left":{"name":"佐藤悠","expression":"weary","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"y_awaken_028"},"y_awaken_028":{"node_id":"y_awaken_028","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"thought","text":"街那头亮起了车灯，一辆接一辆堵在路口，迟迟没有往前开。我盯着那些灯，握着醒铃的手又慢慢收紧。","cast":{"left":{"name":"佐藤悠","expression":"weary","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"y_awaken_029"},"y_awaken_029":{"node_id":"y_awaken_029","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"能不能只留下这间呢？我把醒铃抵在门边，试着照刚才的办法收紧四周。窗帘停在半空，夏希也维持着迈步的姿势。我吓得赶紧松手，她才踉跄着朝我走来。","cast":{"left":{"name":"佐藤悠","expression":"weary","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"y_awaken_030"},"y_awaken_030":{"node_id":"y_awaken_030","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"刚才怎么了？我明明还有一句话没说完。","cast":{"left":{"name":"佐藤悠","expression":"weary","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"next":"y_awaken_031"},"y_awaken_031":{"node_id":"y_awaken_031","branch_id":"y_awaken","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"我刚想试着只留这间教室，结果连你也不动了。那样不行……你还能走吧？让我看看。","cast":{"left":{"name":"佐藤悠","expression":"weary","outfit":"awaken"},"right":{"name":"高桥夏希","expression":"sad","outfit":"school"}},"cues":[],"facts":[],"choices":[{"id":"end","text":"把醒铃转向最后一条连接：「我们还是回去吧。」","next":"y_release_001","tags":["relationship"],"effects":{"last":"release"}},{"id":"stay","text":"「我想留下来。夏希，我想每天都能见到你。」","next":"eternal_end_001","tags":["relationship"],"effects":{"last":"eternal"}},{"id":"room","text":"「再试一次。这次把教室的出口也封住，说不定就行了。」","next":"bad_room_001","tags":["adventure"],"effects":{"last":"room"}}]},"eternal_end_001":{"node_id":"eternal_end_001","branch_id":"eternal_end","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"高桥夏希","kind":"speech","text":"我闭上眼睛，就会看见学姐回头。可我还是不想死……悠，外面那些人也会一直睡着吗？","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"eternal_end_002"},"eternal_end_002":{"node_id":"eternal_end_002","branch_id":"eternal_end","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"speech","text":"会，一直睡着。我也不知道还能持续多久……你要是想走，告诉我，我就按学姐说的把门打开。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"eternal_end_003"},"eternal_end_003":{"node_id":"eternal_end_003","branch_id":"eternal_end","route_label":"最终线","chapter":4,"chapter_title":"第四章 · 永远的放课后","scene":"classroom","time_label":"17:42","speaker":"佐藤悠","kind":"observation","text":"她一直看着门外。我以为她要松开，握着我的那只手却慢慢收紧了。","cast":{"right":{"name":"高桥夏希","expression":"worried","outfit":"school"}},"cues":[],"facts":[],"next":"eternal_end_004"},"eternal_end_004
