// Rendering and preloading share this mapping so a decoded asset is the displayed asset.
const ids = {高桥夏希:'natsuki',小林美咲:'misaki',森田老师:'morita',佐藤悠:'yu'};
function spriteSources(member) {
  const id=ids[member.name], outfit=member.outfit||'school', expression=member.expression||'neutral';
  if (!id) return null;
  if (id==='natsuki' && outfit==='veiled') return {body:'assets/sprites/natsuki-nightmare.png',face:null};
  if (id==='misaki' && member.pose==='wounded') return {body:'assets/sprites/misaki-wounded-fixed-v3.png',face:null};
  const suffix=outfit==='nightmare'?'nightmare-v3':outfit==='school'?'neutral':outfit;
  let face=null;
  if (expression!=='neutral' && id!=='morita') {
    const variant=outfit==='nightmare'?'nightmare-'+expression+'-v3':outfit==='awaken'?'awaken-weary':outfit==='battle'?(id==='misaki'?'injured':'battle-'+expression):expression;
    face=`assets/sprites/${id}-${variant}.png`;
  }
  return {body:`assets/sprites/${id}-${suffix}.png`,face};
}
function nodeAssets(node) {
  const paths=['assets/backgrounds/'+node.scene+'.png'];
  if(node.cg) paths.push('assets/cg/'+node.cg+'.png');
  else {
    if(node.enemy) paths.push('assets/sprites/'+node.enemy+'.png');
    for(const member of Object.values(node.cast||{})) {
      const src=spriteSources(member);if(src)paths.push(src.body,...(src.face?[src.face]:[]));
    }
  }
  return [...new Set(paths)];
}
function createAssetLoader(makeImage=()=>new Image(), timeoutMs=12000, retries=1) {
  const cache=new Map(),versions=new Map();
  const url=path=>path+(versions.get(path)?`?retry=${versions.get(path)}`:'');
  const bump=path=>versions.set(path,(versions.get(path)||0)+1);
  function attempt(path) {
    return new Promise(resolve=>{
      const img=makeImage();let done=false;
      const finish=ok=>{if(done)return;done=true;clearTimeout(timer);resolve(ok);};
      const timer=setTimeout(()=>finish(false),timeoutMs);
      img.onload=async()=>{try{await img.decode?.();finish(true);}catch{finish(false);}};
      img.onerror=()=>finish(false);
      img.src=url(path);
    });
  }
  const load=path=>{

      for(let i=0;i<=retries;i++) {

        if(i<retries)bump(path);

      cache.delete(path);return false;

  };

class InputGate {
  constructor(now=()=>performance.now()){this.now=now;this.until=0;this.epoch=0;}
  begin(){this.epoch++;this.until=Infinity;return this.epoch;}
  current(token){return token===this.epoch;}
  complete(token){if(this.current(token))this.until=this.now()+240;}
  cancel(){this.epoch++;this.until=0;}
  accept(detail=1){if(detail>1||this.now()<this.until)return false;this.until=this.now()+160;return true;}
  afterReveal(){this.until=Math.max(this.until,this.now()+240);}
}

// Decode the actual display element while hidden. A warmed cache on a separate
// Image does not clear the previous bitmap retained by a reused <img> element.
function createImagePresenter(timeoutMs=12000) {
  const pending=new WeakMap();
  return function present(element,src,alt='') {
    if(!src) {
      pending.delete(element);
      element.hidden=true;element.removeAttribute('src');element.alt='';
      return Promise.resolve(true);
    }
    const old=pending.get(element);
    element.alt=alt;
    if(old?.src===src) {
      if(old.ready)element.hidden=false;
      return old.promise;
    }
    element.hidden=true;
    element.removeAttribute('src');
    const request={src,ready:false,promise:null};pending.set(element,request);
    element.src=src;
    request.promise=(async()=>{
      let timer;
      const expired=new Promise(resolve=>timer=setTimeout(()=>resolve(false),timeoutMs));
      const decoded=Promise.resolve().then(()=>element.decode()).then(()=>true,()=>false);
      const ok=await Promise.race([decoded,expired]);clearTimeout(timer);
      if(pending.get(element)!==request || element.getAttribute('src')!==src)return false;
      request.ready=ok;element.hidden=!ok;
      if(!ok)element.removeAttribute('src');
      return ok;
    })();
    return request.promise;
  };
}

function validateBranch(value, originalNode) {
  if (
    !value ||
    typeof value.text !== "string" ||
    value.text.length < 1 ||
    value.text.length > 1800 ||
    typeof value.speaker !== "string" ||
    value.speaker.length > 40 ||
    !Array.isArray(value.choices) ||
    value.choices.length < 1 ||
    value.choices.length > 3
  )
    return false;
  const ids = new Set();
  return value.choices.every((choice) => {
    if (
      !choice ||
      typeof choice.id !== "string" ||
      !/^[a-zA-Z0-9_-]{1,60}$/.test(choice.id) ||
      ids.has(choice.id) ||
      typeof choice.text !== "string" ||
      choice.text.length < 1 ||
      choice.text.length > 200 ||
      !originalNode.choices.some((c) => c.id === choice.original_choice_id)
    )
      return false;
    ids.add(choice.id);
    return true;
  });
}

  if (["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;
  if (event.key === "Escape") {
    event.preventDefault();
    $("modal").open ? closeModal() : menu();
    return;
  }
  if ($("modal").open) return;
  if (event.key === "Enter" || event.key === " ") {
    // Preserve semantic button activation except when focus remains on the reading surface.
    if (
      event.target.tagName === "BUTTON" &&
      event.target.id !== "text-continue" &&
      state.screen !== "title"
    )
      return;
    if (state.screen === "game") {
      event.preventDefault();
      activateSound();
      advance();
    }
    return;
  }
  if (/^[123]$/.test(event.key) && state.screen === "game" && revealed) {
    event.preventDefault();
    const choices = branch ? branch.choices : currentNode().choices || [];
    const choice = choices[Number(event.key) - 1];
    if (choice)
      branch ? chooseBranch(choice.id) : chooseOriginalChoice(choice.id);
  }
});

  activeClock();
  if (document.hidden) stopSound();
  telemetry.record("visibility", currentNode()?.node_id || "title", {
    visible: !document.hidden,
  });
});
